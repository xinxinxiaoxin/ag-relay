<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AG Relay · 网关</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-title">
        <h1>AG Relay · 网关</h1>
        <p class="app-subtitle">relay-retry-proxy 桌面管理面板</p>
      </div>
    </header>

    <main class="app-main">
      <!-- 状态区：每 3 秒轮询 /_relay/status 刷新（网关不可达显示未运行灰态，字段不可读显示未知） -->
      <section class="status-grid" aria-label="网关状态">
        <div class="status-card" id="card-status">
          <span class="status-label">运行状态</span>
          <span class="status-value" data-key="state">—</span>
        </div>
        <div class="status-card" id="card-version">
          <span class="status-label">版本</span>
          <span class="status-value" data-key="version">—</span>
        </div>
        <div class="status-card" id="card-active">
          <span class="status-label">在途请求数</span>
          <span class="status-value" data-key="activeRequests">—</span>
        </div>
        <div class="status-card" id="card-uptime">
          <span class="status-label">已运行时长</span>
          <span class="status-value" data-key="uptime">—</span>
        </div>
      </section>

      <!-- T6：开机自启开关（状态区下方角落，样式从简） -->
      <section class="autostart-line" aria-label="开机自启">
        <span class="autostart-note" id="autostart-note" aria-live="polite"></span>
        <label class="autostart-toggle">
          <input type="checkbox" id="autostart-toggle" />
          开机自启
        </label>
      </section>

      <!-- 操作按钮区：启动/停止/安全重启经 Rust 命令层真实控制 8787 网关；
           退出按钮走同一命令层 quit_app（记退出来源后退出软件，行为与点 × 一致） -->
      <section class="actions" aria-label="网关操作">
        <button type="button" id="btn-start" class="action-btn enabled">启动网关</button>
        <button type="button" id="btn-stop" class="action-btn enabled">停止网关</button>
        <button type="button" id="btn-restart" class="action-btn enabled">安全重启</button>
        <button type="button" id="btn-logs" class="action-btn enabled">打开日志文件夹</button>
        <button type="button" id="btn-quit" class="action-btn enabled">退出</button>
      </section>

      <p class="action-hint" id="action-hint" aria-live="polite">
        若 8787 已有网关在跑，面板会直接接管显示其状态；点击「启动网关」拉起本地网关；关闭窗口、托盘「退出」或面板「退出」都会退出软件并优雅停止本面板启动的网关（最多等 10 秒）。
      </p>
    </main>

    <script src="main.js"></script>
  </body>
</html>
