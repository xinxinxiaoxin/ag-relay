[package]
name = "ag-relay"
version = "0.3.3"
description = "AG Relay · 网关桌面壳"
edition = "2021"

[lib]
name = "ag_relay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file = "1"
notify = "8"
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # F1 外部网关停止：进程快照（父 pid 定位）+ 跨进程读命令行（PEB）
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Wdk_System_Threading",
] }

[features]
# 真实插件下载接缝仍只用随机端口与非安装器文本，不启动产品。
updater-download-tests = ["tauri/test"]

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.3"

[profile.release]
strip = true
