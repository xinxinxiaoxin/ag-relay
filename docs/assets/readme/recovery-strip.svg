<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 360" role="img" aria-labelledby="recovery-title recovery-desc">
  <title id="recovery-title">少一次手动续跑，多一步网关重试</title>
  <desc id="recovery-desc">上方说明未接入网关时，请求遇到 limit 或空回，用户可能需要手动输入继续。下方说明接入后由 AG Relay 在预算内处理可恢复失败，获得有效响应后交给客户端；这不是保证任务永不中断。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#656d76" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1000" height="360" fill="#fff"/>
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" fill="#1f2328">
    <text x="32" y="40" font-size="24" font-weight="600">少一次手动续跑，多一步网关重试。</text>
    <path d="M32 62H968" stroke="#d1d9e0"/>
    <text x="32" y="125" font-size="17" font-weight="600">未接入网关</text>
    <text x="32" y="149" font-size="13" fill="#656d76">失败交给你处理</text>
    <g fill="#fff" stroke="#d1d9e0" stroke-width="1.5">
      <rect x="216" y="97" width="180" height="69" rx="6"/>
      <path d="M484 97H631L653 119V166H484Z"/>
      <path d="M631 97V119H653" fill="#f6f8fa"/>
      <rect x="744" y="97" width="224" height="69" rx="6"/>
    </g>
    <g text-anchor="middle" font-size="16">
      <text x="306" y="128" font-weight="600">发起 Astra 请求</text>
      <text x="306" y="150" font-size="12" fill="#656d76">客户端</text>
      <text x="566" y="126" font-weight="600">limit / 空回</text>
      <text x="566" y="150" font-size="12" fill="#656d76">没有有效回答</text>
      <text x="856" y="137" font-weight="600">手动输入「继续」</text>
    </g>
    <g fill="none" stroke="#656d76" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"><path d="M411 132H469"/><path d="M669 132H729"/></g>
    <path d="M216 192H968" stroke="#d1d9e0" stroke-dasharray="3 5"/>
    <text x="32" y="251" font-size="17" font-weight="600">接入 AG Relay</text>
    <text x="32" y="275" font-size="13" fill="#656d76">网关先尝试恢复</text>
    <rect x="216" y="222" width="180" height="72" rx="6" fill="#fff" stroke="#d1d9e0" stroke-width="1.5"/>
    <rect x="476" y="212" width="194" height="92" rx="9" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.8"/>
    <rect x="744" y="222" width="224" height="72" rx="6" fill="#fff" stroke="#d1d9e0" stroke-width="1.5"/>
    <g text-anchor="middle">
      <text x="306" y="253" font-size="16" font-weight="600">照常发起请求</text>
      <text x="306" y="276" font-size="12" fill="#656d76">客户端无需额外操作</text>
      <text x="573" y="246" font-size="17" font-weight="600">网关内部重试</text>
      <text x="573" y="270" font-size="12" fill="#656d76">遇到可恢复的 limit / 空回</text>
      <text x="573" y="289" font-size="11" fill="#656d76">有次数与时间预算</text>
      <text x="856" y="253" font-size="16" font-weight="600">交回有效响应</text>
      <text x="856" y="276" font-size="12" fill="#656d76">获得有效响应后继续任务</text>
    </g>
    <g fill="none" stroke="#656d76" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"><path d="M411 258H461"/><path d="M685 258H729"/></g>
    <text x="32" y="341" font-size="12" fill="#656d76">机制示意：只处理满足条件的可恢复失败；超出预算或确定性错误仍会明确返回。</text>
  </g>
</svg>
